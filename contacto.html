<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contacto | APEKEYS</title>
    <meta
      name="description"
      content="Escríbenos: soporte de activación, dudas de compra y atención al cliente de APEKEYS."
    />
    <link rel="icon" href="img/logo.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="css/styles.css" />
    <script defer src="js/data.js"></script>
    <script defer src="js/validaciones.js"></script>
    <script defer src="js/app.js"></script>
    <script defer src="js/paginas.js"></script>
  </head>
  <body data-page="contacto">
    <div data-site-header></div>

    <main class="page-main">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow">Estamos para ayudarte</span>
            <h1>Contacto</h1>
            <p>Formulario de contacto de la demostración.</p>
          </div>
        </div>

        <div class="contacto-layout">
          <section class="card form-card">
            <h2>Formulario de contacto</h2>
            <form id="contactoForm" novalidate>
              <div class="alert hidden" data-form-message role="alert"></div>

              <label class="field" for="contNombre"
                >Nombre completo
                <input
                  class="form-control"
                  id="contNombre"
                  type="text"
                  name="nombre"
                  maxlength="100"
                  autocomplete="name"
                  required
                />
                <span class="field-error"></span>
              </label>

              <label class="field" for="contEmail"
                >Correo electrónico
                <input
                  class="form-control"
                  id="contEmail"
                  type="email"
                  name="email"
                  maxlength="100"
                  autocomplete="email"
                  placeholder="nombre@correo.com"
                  required
                />
                <span class="field-error"></span>
              </label>

              <label class="field" for="contComentario"
                >Comentario
                <textarea
                  class="form-control"
                  id="contComentario"
                  name="comentario"
                  maxlength="500"
                  required
                ></textarea>
                <span class="field-hint muted" data-char-count>0 / 500 caracteres</span>
                <span class="field-error"></span>
              </label>

              <button class="btn btn-primary" type="submit">Enviar mensaje</button>
            </form>
          </section>

          <aside class="card card-body">
            <h2>Acerca del formulario</h2>
            <p>Los mensajes se guardan en este navegador para la demostración del proyecto.</p>
          </aside>
        </div>
      </div>
    </main>

    <footer data-site-footer></footer>
  </body>
</html>
