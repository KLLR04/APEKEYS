<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Software | APEKEYS</title>
    <meta
      name="description"
      content="Licencias de software y suscripciones digitales disponibles en APEKEYS."
    />
    <link rel="icon" href="img/logo.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="css/styles.css" />
    <script defer src="js/data.js"></script>
    <script defer src="js/validaciones.js"></script>
    <script defer src="js/app.js"></script>
    <script defer src="js/catalogo.js"></script>
  </head>
  <body data-page="software">
    <div data-site-header></div>

    <main class="page-main">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow">Licencias digitales</span>
            <h1>Software</h1>
            <p>Suscripciones y herramientas para completar tu equipo.</p>
          </div>
        </div>

        <section class="card toolbar" aria-label="Filtros de software">
          <label class="field" for="catalogSearch"
            >Buscar
            <input
              class="form-control"
              id="catalogSearch"
              type="search"
              maxlength="60"
              placeholder="Buscar software"
            />
          </label>
          <label class="field" for="catalogSort"
            >Ordenar por
            <select class="form-select" id="catalogSort">
              <option value="nombre">Nombre (A-Z)</option>
              <option value="precio-asc">Precio: menor a mayor</option>
              <option value="precio-desc">Precio: mayor a menor</option>
            </select>
          </label>
        </section>

        <p class="muted" data-result-count aria-live="polite"></p>
        <section class="row g-3" data-products-grid aria-label="Listado de software"></section>
      </div>
    </main>

    <footer data-site-footer></footer>
  </body>
</html>
