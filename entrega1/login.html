<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar sesión | APEKEYS</title>
    <link rel="icon" href="img/logo.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script defer src="js/data.js"></script>
    <script defer src="js/validaciones.js"></script>
    <script defer src="js/auth.js"></script>
  </head>
  <body data-page="login">
    <main class="container-fluid vh-100 p-0 overflow-hidden">
      <div class="row g-0 h-100">
        <div class="col-md-6 d-flex justify-content-center align-items-center p-4 bg-body h-100">
          <div class="card shadow p-4 w-100" style="max-width: 450px">
            <a href="index.html" class="logo-box text-body mb-3"
              ><img src="img/logo.png" alt="Logo APEKEYS" /><span>APEKEYS</span></a
            >
            <h1 class="h3 text-center mb-4">Iniciar sesión</h1>
            <form id="loginForm" novalidate>
              <div class="alert alert-danger hidden" data-form-message></div>
              <div class="field mb-3">
                <label class="form-label" for="email">Correo electrónico</label>
                <input
                  class="form-control"
                  id="email"
                  type="email"
                  name="email"
                  maxlength="100"
                  autocomplete="username"
                  required
                /><span class="field-error"></span>
              </div>
              <div class="field mb-3">
                <label class="form-label" for="password">Contraseña</label>
                <input
                  class="form-control"
                  id="password"
                  type="password"
                  name="password"
                  minlength="4"
                  maxlength="10"
                  autocomplete="current-password"
                  required
                /><span class="field-error"></span>
              </div>
              <button class="btn btn-primary w-100" type="submit">Iniciar sesión</button>
            </form>
            <a class="btn btn-outline-secondary w-100 mt-2" href="registro.html">Crear cuenta</a>
            <hr />
            <p class="small text-secondary mb-0">
              Administrador: <code>admin@duoc.cl / Admin123</code><br />Cliente:
              <code>cliente@gmail.com / Cliente123</code>
            </p>
          </div>
        </div>
        <div class="col-md-6 d-none d-md-block h-100">
          <img
            src="img/banner_holder.jpg"
            alt="Banner APEKEYS"
            class="w-100 h-100"
            style="object-fit: cover"
          />
        </div>
      </div>
    </main>
  </body>
</html>
