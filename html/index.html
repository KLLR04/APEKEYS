    <!-- LIBRERIAS DE BOOTSTRAP JONAS 05/09-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<body style="background-color: #2d3137;">

<!-- PRUEBA -->
<header>
  <div class="header-top">

      <div class="header-left">
          <div class="logo-box">

      <div class="header-actions">

      </div>

  </div>

  <!-- Navbar adaptado a Bootstrap con botones y menú desplegable -->
  <nav class="navbar bg-body-tertiary">
    <div class="container-fluid justify-content-start">
      <a class="btn btn-outline-success me-2" href="index.html">Inicio</a>
      <a class="btn btn-outline-secondary me-2" href="productos.html">Productos</a>
      <a class="btn btn-outline-secondary me-2" href="software.html">Software</a>

      <!-- Menú desplegable adaptado como botón/dropdown -->
      <div class="dropdown">
        <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          Categorías
        </button>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="#">Battle Royale</a></li>
          <li><a class="dropdown-item" href="#">Carreras</a></li>

          <li><a class="dropdown-item" href="#">Terror</a></li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<main>
    <!-- Carrusel de imágenes adaptado a Bootstrap -->
  <div id="carouselExample" class="carousel slide carrusel-pequeno mx-auto" data-bs-ride="carousel">
    <!-- Indicadores añadidos: Vitales para la navegación espacial del usuario -->
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1" aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="2" aria-label="Slide 3"></button>
    </div>

    <div class="carousel-inner">
      <div class="carousel-item active" data-bs-interval="4000">
        
        <img src="../img/Carrusel index/carrousel_1.png" class="d-block w-100" alt="Descripción de la imagen 1">
      </div>
      <div class="carousel-item" data-bs-interval="4000">
        <img src="../img/Carrusel index/carrousel_2.png" class="d-block w-100" alt="Descripción de la imagen 2">
      </div>
      <div class="carousel-item" data-bs-interval="4000">
        <img src="../img/Carrusel index/carrousel_3.png" class="d-block w-100" alt="Descripción de la imagen 3">
      </div>
    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>

  <!-- SEPARADOR DINÁMICO: Título de Sección -->
  <section class="container mt-5 mb-4">
    <div class="row align-items-center">
        <h2 class="text-center text-uppercase text-white fw-bold mb-0">Destacados y Recomendados</h2>
    </div>
  </section>

  <section class="container mt-5 mb-4">
    <div class="row align-items-center">
        <h2 class="text-center text-uppercase text-white fw-bold mb-0">Explorar por Categorías</h2>
    </div>
  </section>

  <section class="container mt-5 mb-4">
    <div class="row align-items-center">
        <h2 class="text-center text-uppercase text-white fw-bold mb-0">Los más Vendidos</h2>
    </div>
  </section>

  <section class="container mt-5 mb-4">
    <div class="row align-items-center">
        <h2 class="text-center text-uppercase text-white fw-bold mb-0">Ofertas</h2>
    </div>
  </section>

  <!-- Se incluyen los juegos de la tienda con JavaScript -->
  <div class="Contenedor-de-juegos container mb-5">
    <!-- El JS inyectará las cards aquí -->
  </div>
