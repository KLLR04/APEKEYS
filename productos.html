<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Productos | APEKEYS</title><link rel="icon" href="img/logo.png"><link rel="stylesheet" href="css/styles.css"><script defer src="js/data.js"></script><script defer src="js/app.js"></script><script defer src="js/catalogo.js"></script><script defer src="js/productos.js"></script></head>
<body data-page="products"><div data-site-header></div><main class="page-main"><div class="container"><div class="section-head"><div><span class="eyebrow">Catálogo</span><h1>Productos</h1><p>Juegos y software para PC y consola.</p></div><div class="hidden" data-admin-product><button class="btn btn-primary" type="button" data-new-product>Nuevo producto</button> <button class="btn btn-secondary" type="button" data-logout>Cerrar sesión</button></div></div><section class="card toolbar" aria-label="Filtros del catálogo"><label class="field">Buscar<input class="input" id="catalogSearch" type="search" maxlength="60" placeholder="Nombre, código o plataforma"></label><label class="field">Categoría<select class="select" id="catalogCategory"><option value="">Todas</option></select></label><a class="btn btn-secondary" href="carrito.html">Ver carrito</a></section><section class="grid product-grid" data-products-grid aria-live="polite"></section><section class="card form-card section hidden" id="productPanel" data-admin-product><form id="productForm" novalidate><input type="hidden" name="productId"><h2 data-form-title>Nuevo producto</h2><div class="alert hidden" data-form-message></div><div class="form-grid"><label class="field">Código<input class="input" name="codigo" maxlength="30" required></label><label class="field">Nombre<input class="input" name="nombre" maxlength="100" required></label><label class="field">Categoría<select class="select" name="categoria" required><option value="">Selecciona</option><option>Battle Royale</option><option>Carreras</option><option>Deportes</option><option>Multijugador</option><option>Mundo Abierto</option><option>Plataformas</option><option>Rol</option><option>Software</option><option>Terror</option></select></label><label class="field">Plataforma<select class="select" name="plataforma"><option>PC</option><option>Steam</option><option>PlayStation</option><option>Xbox</option></select></label><label class="field">Precio<input class="input" type="number" name="precio" min="0" step="0.01" required></label><label class="field">Stock<input class="input" type="number" name="stock" min="0" step="1" required></label><label class="field span-2">Descripción<textarea class="textarea" name="descripcion" maxlength="500"></textarea></label><label class="field" style="display:flex;align-items:center;gap:10px"><input type="checkbox" name="activo" checked> Producto activo</label></div><div style="display:flex;gap:10px;margin-top:20px"><button class="btn btn-primary" type="submit">Guardar</button><button class="btn btn-secondary" type="button" data-cancel-product>Cancelar</button></div></form></section><section class="section hidden" data-admin-product><div class="section-head"><div><h2>Listado administrativo</h2><p>Funciones tomadas del aporte de Bayron y del ejemplo de clases.</p></div></div><div class="card table-card" data-product-table><table><thead><tr><th>Código</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th style="text-align:right">Acciones</th></tr></thead><tbody></tbody></table></div></section></div></main><footer data-site-footer></footer></body>
</html>
