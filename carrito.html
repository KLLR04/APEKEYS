<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Carrito | APEKEYS</title>
    <meta
      name="description"
      content="Revisa tu carrito de compras en APEKEYS antes de finalizar el pedido."
    />
    <link rel="icon" href="img/logo.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="css/styles.css" />
    <script defer src="js/data.js"></script>
    <script defer src="js/validaciones.js"></script>
    <script defer src="js/app.js"></script>
    <script defer src="js/carrito.js"></script>
  </head>
  <!-- data-require-session: si no hay sesión iniciada, app.js redirige al login -->
  <body data-page="cart" data-require-session>
    <div data-site-header></div>

    <main class="page-main">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow">Tu selección</span>
            <h1>Carrito de compras</h1>
            <p>
              Ajusta las cantidades antes de finalizar. Solo puedes comprar hasta el stock
              disponible.
            </p>
          </div>
          <a class="btn btn-secondary btn-sm" href="productos.html">Seguir comprando</a>
        </div>

        <section class="cart-list" data-cart-list aria-label="Productos en el carrito"></section>

        <section class="card cart-summary hidden" data-cart-summary>
          <div>
            <span class="muted">Total de la compra</span><br />
            <strong data-cart-total>$0</strong>
          </div>
          <button class="btn btn-primary" type="button" data-checkout>Finalizar compra</button>
        </section>
      </div>
    </main>

    <footer data-site-footer></footer>
  </body>
</html>
