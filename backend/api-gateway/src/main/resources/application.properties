# ==========================================
# proyecto fullstack ii
# api gateway
# ==========================================

# nombre del microservicio
spring.application.name=api-gateway

# puerto del api gateway
server.port=8080

# ==========================================
# eureka server
# ==========================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ==========================================
# cors para el frontend
# ==========================================

# permitir peticiones desde el frontend en vite y en create react app
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173,http://localhost:3000
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true

# evitar cabeceras cors duplicadas en la respuesta
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

# ==========================================
# spring cloud gateway rutas
# ==========================================

# enrutar al microservicio de usuarios
spring.cloud.gateway.server.webflux.routes[0].id=ms-usuario
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ms-usuario
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/usuarios,/api/usuarios/**,/api/auth/**,/api/tipos-usuario,/api/tipos-usuario/**

# enrutar al microservicio de catalogo
spring.cloud.gateway.server.webflux.routes[1].id=ms-catalogo
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ms-catalogo
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/categorias,/api/categorias/**,/api/productos,/api/productos/**

# enrutar al microservicio de pedidos
spring.cloud.gateway.server.webflux.routes[2].id=ms-pedidos
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ms-pedidos
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/carritos,/api/carritos/**,/api/pedidos,/api/pedidos/**

# enrutar al microservicio de favoritos
spring.cloud.gateway.server.webflux.routes[3].id=ms-favoritos
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ms-favoritos
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/favoritos,/api/favoritos/**
