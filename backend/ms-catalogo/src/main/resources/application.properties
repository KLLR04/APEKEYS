# ==========================================
# proyecto fullstack ii
# microservicio ms catalogo
# ==========================================

# nombre y puerto del microservicio
spring.application.name=ms-catalogo
server.port=8082

# ==========================================
# conexion a mysql
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3308/db_catalogo?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# configuracion jpa hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# eureka server
# ==========================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ==========================================
# autenticacion jwt
# ==========================================

# usar la misma clave que ms usuario
jwt.secret=${JWT_SECRET}

# ==========================================
# comunicacion interna entre microservicios
# ==========================================

# validar esta clave en las llamadas de ms pedidos para descontar stock
app.internal.api-key=${INTERNAL_API_KEY}

# ==========================================
# errores
# ==========================================

# incluir el mensaje de error en la respuesta para mostrarlo en el frontend
server.error.include-message=always

# ==========================================
# logs
# ==========================================

logging.level.org.springframework.security=INFO
