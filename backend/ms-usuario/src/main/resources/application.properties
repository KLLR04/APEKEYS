# ==========================================
# proyecto fullstack ii
# microservicio ms usuario
# ==========================================

# nombre y puerto del microservicio
spring.application.name=ms-usuario
server.port=8081

# ==========================================
# conexion a mysql
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3308/db_usuarios?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# configuracion jpa hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# eureka server
# ==========================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ==========================================
# autenticacion jwt
# ==========================================

# leer la clave desde la variable de entorno jwt secret de minimo 32 caracteres
jwt.secret=${JWT_SECRET}

# definir duracion del token en milisegundos equivalente a una hora
jwt.expiration=3600000

# ==========================================
# administrador inicial
# ==========================================

# crear este usuario administrador al iniciar si no existe
app.admin.email=admin@fullstack.cl
app.admin.password=${ADMIN_PASSWORD:Admin123}
app.admin.nombre=Administrador
app.admin.apellido=Sistema

# ==========================================
# errores
# ==========================================

# incluir el mensaje de error en la respuesta para mostrarlo en el frontend
server.error.include-message=always

# ==========================================
# logs
# ==========================================

logging.level.org.springframework.security=INFO
