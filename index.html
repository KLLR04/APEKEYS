<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>APEKEYS</title>
    <link rel="icon" href="img/logo.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script defer src="js/data.js"></script>
    <script defer src="js/app.js"></script>
    <script defer src="js/catalogo.js"></script>
  </head>
  <body data-page="home">
    <div data-site-header></div>
    <main class="page-main">
      <div class="container">
        <div id="carouselPrincipal" class="carousel slide carrusel-pequeno" data-bs-ride="carousel">
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img
                src="img/Carrusel index/carrousel_1.png"
                class="d-block w-100"
                alt="Promoción de videojuegos"
              />
            </div>
            <div class="carousel-item">
              <img
                src="img/Carrusel index/carrousel_2.png"
                class="d-block w-100"
                alt="Juegos destacados"
              />
            </div>
            <div class="carousel-item">
              <img
                src="img/Carrusel index/carrousel_3.png"
                class="d-block w-100"
                alt="Novedades APEKEYS"
              />
            </div>
          </div>
          <button
            class="carousel-control-prev"
            type="button"
            data-bs-target="#carouselPrincipal"
            data-bs-slide="prev"
          >
            <span class="carousel-control-prev-icon" aria-hidden="true"></span
            ><span class="visually-hidden">Anterior</span>
          </button>
          <button
            class="carousel-control-next"
            type="button"
            data-bs-target="#carouselPrincipal"
            data-bs-slide="next"
          >
            <span class="carousel-control-next-icon" aria-hidden="true"></span
            ><span class="visually-hidden">Siguiente</span>
          </button>
        </div>

        <section class="mt-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h4 text-white mb-0">Juegos destacados</h2>
            <a class="btn btn-light btn-sm" href="productos.html">Ver productos</a>
          </div>
          <div class="row g-3" data-featured-products></div>
        </section>
      </div>
      <section class="container mt-4 text-white">
        <h2 class="h4">Cómo comprar</h2>
        <p>Video de demostración del proceso de compra.</p>
        <video
          class="w-100"
          style="max-width:720px"
          controls
          preload="metadata"
          poster="img/video-portada.jpg"
        >
          <source src="video/instrucciones-compra.mp4" type="video/mp4" />
        </video>
        <p class="small">
          La compra se simula en el navegador. No se cobran pagos ni se envían claves.
        </p>
      </section>
    </main>
    <footer data-site-footer></footer>
  </body>
</html>
