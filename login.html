<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Iniciar Sesión</title>
    
    <link rel="icon" type="image/png" href="img/logo.png">
</head>
<body>
<div class="container-fluid vh-100 p-0 overflow-hidden">
    <div class="row g-0 h-100">
        <!-- COLUMNA 1: Formulario -->
        <div class="col-md-6 d-flex flex-column justify-content-center align-items-center p-4 bg-light h-100">
            <div class="card shadow p-4 w-100" style="max-width: 450px;">
                <h2 class="text-center mb-4">Iniciar Sesión</h2>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="correo" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>

                    <div id="mensaje" class="mb-3"></div>

                    <!-- Botones -->
                    <button type="submit" class="btn btn-primary w-100 mb-3">Iniciar Sesión</button>
                    <button class="btn btn-sm btn-outline-secondary w-100" type="button">Iniciar Sesión con Google</button>
                </form>
            </div>
        </div>

        <!-- COLUMNA 2: Banner Vertical (Lado Derecho) -->
        <div class="col-md-6 d-none d-md-block h-100">
            <img src="img/banner_holder.jpg" alt="banner_holder" class="w-100 h-100" style="object-fit: cover;">
        </div>

    </div>
</div>

<script>
    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", async function(event){
        event.preventDefault();
        const correo = document.getElementById("correo").value;
        const password = document.getElementById("password").value;
        const mensaje = document.getElementById("mensaje");

        try {
            const respuesta = await fetch(
                "http://localhost:8080/api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        correo: correo,
                        password: password
                    })
                }
            );

            const datos = await respuesta.json();

            if (respuesta.ok) {
                // Guardar token y usuario
                localStorage.setItem("token", datos.token);
                localStorage.setItem("usuario", JSON.stringify(datos.usuario));

                // Redirigir
                window.location.href = "mantenedor-producto.html";
            } else {
                mensaje.className = "alert alert-danger";
                mensaje.textContent = datos.mensaje || "Correo o contraseña incorrectas";
            }

        } catch (error) {
            console.log(error);
            mensaje.className = "alert alert-danger";
            mensaje.textContent = "No se pudo conectar con el servidor";
        }
    });
</script>
</body>
</html>
