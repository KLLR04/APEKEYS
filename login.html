<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Iniciar sesión | APEKEYS</title>
    <link rel="icon" href="img/logo.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <script defer src="js/data.js"></script>
    <script defer src="js/auth.js"></script>
  </head>
  <body data-page="login">
    <main class="login-layout">
      <section class="login-art">
        <img src="img/banner_holder.jpg" alt="Universo de videojuegos APEKEYS" />
        <div class="login-copy">
          <span class="eyebrow">Bienvenido de vuelta</span>
          <h1 class="pixel">Vuelve a tu partida</h1>
          <p>Gestiona el catálogo o continúa explorando tus juegos favoritos.</p>
        </div>
      </section>
      <section class="login-panel">
        <div class="login-box">
          <a class="brand" href="index.html"
            ><img src="img/logo.png" alt="Logo APEKEYS" /><span>APEKEYS</span></a
          >
          <h2>Iniciar sesión</h2>
          <p class="muted">Ingresa tu correo y contraseña.</p>
          <form id="loginForm" novalidate>
            <div class="alert hidden" data-form-message></div>
            <label class="field"
              >Correo electrónico<input
                class="input"
                type="email"
                name="email"
                maxlength="100"
                autocomplete="username"
                required
                placeholder="nombre@duoc.cl" /></label
            ><label class="field" style="margin-top:14px"
              >Contraseña<input
                class="input"
                type="password"
                name="password"
                minlength="4"
                maxlength="10"
                autocomplete="current-password"
                required /></label
            ><button class="btn btn-primary btn-block" style="margin-top:20px" type="submit">
              Ingresar
            </button>
          </form>
          <div class="credentials">
            <strong>Cuenta de demostración</strong><br />Administrador: <code>admin@duoc.cl</code
            ><br />Contraseña: <code>Admin123</code>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
