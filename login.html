<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Iniciar Sesión</title>
    
    <link rel="icon" type="image/png" href="img/logo.png">
</head>
<body>
<div class="container-fluid min-vh-100 p-0">
    <div class="row g-0 min-vh-100">
        <div class="col-md-6 d-flex flex-column justify-content-center align-items-start p-5 bg-light">
            <div class="card shadow p-4 mx-auto mx-md-0" style="width: 800%; max-width: 800px;">
                <h2 class="text-center mb-4">Iniciar Sesión</h2>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="correo" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>

                    <div id="mensaje" class="mb-3"></div>

                    <!-- Botones con espaciado correcto -->
                    <button type="submit" class="btn btn-primary w-100 mb-3">Iniciar Sesión</button>
                    <button class="btn btn-sm btn-outline-secondary w-100" type="button">Iniciar Sesión con Google</button>
                </form>
            </div>
        </div>

        <!-- COLUMNA 2: Banner Vertical (Lado Derecho) -->
        <div class="col-md-6 d-none d-md-block min-vh-100">
            <img src="img/banner_holder.jpg" alt="banner_holder" class="100 h-100" style="object-fit: fill;">
        </div>

    </div>
</div>
</body>
</html>
<script>
    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", async function(event){
        event.preventDefault();
        const correo = document.getElementById("correo").value;
        const password = document.getElementById("password").value;
        const mensaje = document.getElementById("mensaje");

        try{
            const respuesta = await fetch(
                "http://localhost:8080/api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        correo: correo,
                        password: password
                    })
                }
            );

            const datos = await respuesta.json();
            console.log(datos);
            console.log("***********");
            console.log(respuesta);

            if(respuesta.ok){
                //guardar el token
                localStorage.setItem("token", datos.token);
                //guardar datos del usuario
                localStorage.setItem("usuario", JSON.stringify(datos.usuario));

                //enviar al index
                window.location.href="mantenedor-producto.html";
            }else{
                mensaje.className ="alert alert-danger";
                mensaje.textContent = datos.mensaje || "Correo o contraseña incorrectas";
            }


        }catch{
            console.log(error);
            mensaje.className = "alert alert-danger";
            mensaje.textContent = "No se pudo conectar con el servidor";
        }



    });



</script>
